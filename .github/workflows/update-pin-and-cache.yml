name: Update pin + build + push cache

# Polls the fork for a new v*-linux tag, bumps the pin, builds
# `.#foundation-sunshine-upstream`, uploads the closure (+ the web UI and the
# source FOD) to Cachix and only then commits the pin — a failing tag never
# corrupts this repo.
#
# The build is the CUDA/NVENC variant: the package takes `cudaPackages ? null`
# and `callPackage` fills that in from pkgs, so CUDA is on in this flake's own
# evaluation (verified: -DSUNSHINE_ENABLE_CUDA:BOOL=TRUE). An earlier version of
# this comment claimed otherwise — do not "optimise" it by passing
# `cudaPackages = null`, that would silently drop NVENC from the cache.
#
# Trigger: 30-min poll of Biaogo/foundation-sunshine-linux tags, or manual
# workflow_dispatch (optionally with an explicit tag name; `force` also
# repairs the cache for an already-current pin).
# No push trigger on this repo, so the final commit cannot loop anything.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to pin (default: newest v*-linux tag of the fork)"
        required: false
        type: string
      force:
        description: "Run build + cache push even if the pin is already current (cache repair)"
        required: false
        default: false
        type: boolean

concurrency:
  group: update-pin-and-cache
  cancel-in-progress: false

permissions:
  contents: write # commit + push the pin bump to THIS repo

env:
  FORK: Biaogo/foundation-sunshine-linux
  CACHE: biaogo

jobs:
  update-pin-and-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout (this repo)
        uses: actions/checkout@v5

      - name: Install Nix + cachix
        uses: cachix/install-nix-action@v31
        with:
          enable_kvm: false
          extra_nix_config: |
            http-connections = 50
            accept-flake-config = true

      - name: Install cachix CLI
        # No --print-build-logs here: newer Nix (2.34+) rejects the flag on
        # `nix profile install` outright (exit 1 before anything happens),
        # and this step builds nothing anyway, so quiet logs are pointless.
        run: nix profile install nixpkgs#cachix

      - name: Resolve target tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          input_tag="${{ inputs.tag || '' }}"
          if [ -n "$input_tag" ]; then
            TAG="$input_tag"
          else
            # Pick by REAL creation time, not by name order. The fork's tag names can carry a
            # same-day suffix (v2026.09.26.1-linux) and a tag created today may well bear an
            # earlier date than one pushed yesterday — the REST /tags endpoint returns name
            # order, which silently picks the wrong one. A blobless bare clone costs a few
            # seconds and gives real tag dates; only v<date>[.<n>]-linux names are considered.
            rm -rf /tmp/fork-tags.git
            git clone --quiet --bare --filter=blob:none "https://github.com/$FORK.git" /tmp/fork-tags.git
            TAG=$(git -C /tmp/fork-tags.git for-each-ref --sort=-creatordate \
                    --format='%(refname:short)' 'refs/tags/v*-linux' \
                  | grep -E '^v[0-9]{4}[.][0-9]{2}[.][0-9]{2}([.][0-9]+)?-linux$' | head -1)
            if [ -z "$TAG" ]; then
              echo "no v<date>-linux tag found in $FORK" >&2
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          PINNED=$(grep -oP '# tag: \K.*' pkgs/foundation-sunshine-upstream/default.nix)
          PINNED_SHA=$(grep -oP '^  rev = "\K[0-9a-f]{40}' pkgs/foundation-sunshine-upstream/default.nix)
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          if [ "$TAG" = "$PINNED" ]; then
            echo "already-pinned=true" >> "$GITHUB_OUTPUT"
            # Emit the CURRENT pin's sha too: a `force` run (cache / hash repair)
            # still builds and pushes that pin, and the prefetch step needs a
            # real sha — leaving it empty produced
            # `.../archive/.tar.gz` → HTTP 404 (2026-09 hit, forced run).
            test -n "$PINNED_SHA" || { echo "no rev= in default.nix"; exit 1; }
            echo "sha=$PINNED_SHA" >> "$GITHUB_OUTPUT"
            echo "$TAG already pinned — nothing to do (sha ${PINNED_SHA:0:8})"
          else
            echo "already-pinned=false" >> "$GITHUB_OUTPUT"
            # Resolve the tag to a COMMIT sha (peel annotated tags).
            OBJ_TYPE=$(gh api "repos/$FORK/git/ref/tags/$TAG" --jq '.object.type')
            if [ "$OBJ_TYPE" = "tag" ]; then
              OBJ=$(gh api "repos/$FORK/git/ref/tags/$TAG" --jq '.object.sha')
              SHA=$(gh api "repos/$FORK/git/tags/$OBJ" --jq '.object.sha')
            else
              SHA=$(gh api "repos/$FORK/git/ref/tags/$TAG" --jq '.object.sha')
            fi
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "target: $TAG @ $SHA"
          fi

      - name: Skip (already current)
        if: steps.tag.outputs.already-pinned == 'true'
        run: |
          echo "No new v*-linux tag since $(grep -oP '# tag: \K.*' pkgs/foundation-sunshine-upstream/default.nix) — done."

      - name: Prefetch source hash
        if: steps.tag.outputs.already-pinned == 'false' || inputs.force
        id: hash
        run: |
          set -euo pipefail
          SHA="${{ steps.tag.outputs.sha }}"
          test -n "$SHA" || { echo "no sha resolved by the tag step — refusing to build a bogus URL"; exit 1; }
          # FIRST GUESS ONLY, and it is deliberately cheap: this hashes the
          # plain codeload tarball, which excludes submodules, while the package
          # fetches with `fetchSubmodules = true` — so this value can never
          # match the final pin. The Build step replaces it with nix's own value
          # (`nix hash path --sri` on the realised FOD) before anything is
          # committed. Kept because it is instant and gives the retry loop a
          # realistic starting point.
          #
          # Exception: a repair run (`force`) on an already-realised pin must NOT
          # write that placeholder over a good hash and then wait for a build
          # failure to repair it — nix already knows the answer locally, so take
          # it directly and keep the pin untouched.
          if [ "${{ steps.tag.outputs.already-pinned }}" = 'true' ] \
             && P=$(nix eval --raw .#foundation-sunshine-upstream.src.outPath 2>/dev/null) \
             && [ -e "$P" ]; then
            H=$(nix hash path --sri "$P")
            echo "reused realised FOD ($P) — hash taken from nix, not from codeload"
          else
            H=$(nix store prefetch-file --json --unpack --hash-type sha256 \
              "https://github.com/$FORK/archive/$SHA.tar.gz" | jq -r '.hash')
            echo "prefetched (codeload, subs excluded — placeholder): $H"
          fi
          echo "hash=$H" >> "$GITHUB_OUTPUT"

      - name: Bump pin (version / rev / hash / README)
        if: steps.tag.outputs.already-pinned == 'false' || inputs.force
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.tag.outputs.sha }}
          SRC_HASH: ${{ steps.hash.outputs.hash }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"; VERSION="${VERSION%-linux}"
          python3 scripts/update-pin.py "$VERSION" "$TAG" "$SHA" "$SRC_HASH"
          git --no-pager diff --stat

      - name: Build (hash-fixup retry x3)
        if: steps.tag.outputs.already-pinned == 'false' || inputs.force
        id: build
        run: |
          set -euo pipefail
          ok=""
          for attempt in 1 2 3; do
            echo "=== build attempt $attempt ==="
            if nix build .#foundation-sunshine-upstream --no-link --print-out-paths -L \
              > build.log 2>&1; then
              ok=1; break
            fi
            if grep -q "hash mismatch in fixed-output derivation" build.log; then
              echo "stale pin hash — auto-fixing from log and retrying"
              python3 scripts/update-pin.py --fix-from-log build.log
            else
              echo "build failed (not a hash issue):"
              tail -40 build.log
              exit 1
            fi
          done
          if [ -z "$ok" ]; then
            echo "hash-fixup retries exhausted"; tail -40 build.log; exit 1
          fi
          # `set -e` is ON: an empty extraction or an unwritable $GITHUB_OUTPUT
          # must fail the job here, never be handed on as an empty argument.
          OUT=$(grep -oE '/nix/store/[a-z0-9]+-foundation-sunshine-upstream-[^ ]+' build.log | tail -1)
          test -n "$OUT" || { echo "could not extract the built out path from build.log"; exit 1; }
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

          # Pin the source hash to nix's OWN value, never to a grep of the log
          # and never to the prefetch guess: `src` uses fetchSubmodules = true,
          # so the codeload prefetch above is always a different (smaller) tree.
          # nix has the FOD realised by now; hashing it reproduces exactly the
          # `hash =` attr of fetchFromGitHub (verified 2026-09: nix hash path
          # --sri <src> == the pinned SRI for the same rev). update-pin.py is
          # idempotent, so this also covers runs where the retry already fixed it.
          VERSION="${TAG#v}"; VERSION="${VERSION%-linux}"
          H=$(nix hash path --sri "$(nix eval --raw .#foundation-sunshine-upstream.src.outPath)")
          python3 scripts/update-pin.py "$VERSION" "$TAG" "$SHA" "$H"
          echo "$H" > "$RUNNER_TEMP/src-hash.txt"
          echo "source hash (from nix): $H"

          rm -f build.log
          echo "built: $OUT"

      - name: Push closure to Cachix
        if: steps.tag.outputs.already-pinned == 'false' || inputs.force
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          # Push = binary + runtime closure; nixpkgs deps inside it are
          # skipped automatically (already on cache.nixos.org), so only
          # fsl-specific artifacts ever land in the cache.
          #
          # Derive the path HERE instead of trusting a cross-step output:
          # 2026-09 a run pushed `$CACHE "" "$UI" "$SRC"` (the first argument
          # expanded to an empty string), cachix resolved it to the work dir,
          # only WARNED, and the job stayed green while the main closure never
          # reached the cache. Build is cached at this point, so re-asking nix
          # costs nothing.
          OUT=$(nix build .#foundation-sunshine-upstream --no-link --print-out-paths | tail -1)
          test -n "$OUT" || { echo "empty out path — refusing to push"; exit 1; }
          # The web UI is a build-time-only input (not in the runtime closure) —
          # push it explicitly so downstream builds need zero compilation. The
          # path is checked into the store as well, so the main package does not
          # lose it in between.
          UI=$(nix build .#foundation-sunshine-upstream.ui --no-link --print-out-paths | tail -1)
          # The git source tree is the single most fragile input of this build:
          # `fetchSubmodules = true` makes Nix clone ~20 repos recursively, and
          # any TLS hiccup anywhere in that graph fails the whole derivation.
          # Runners have clean network, so fetch it once here and publish it —
          # downstream builds (including the NixOS host that installs this) then
          # substitute it instead of re-cloning the world.
          SRC=$(nix eval --raw .#foundation-sunshine-upstream.src.outPath)
          nix-store --realise "$SRC"
          cachix push "$CACHE" "$OUT" "$UI" "$SRC"

          # Self-check: a "pushed" closure that is not readable back from the
          # cache must turn the job RED (cachix only warns on a skipped path).
          # The key is public; it is passed explicitly because the runner has no
          # biaogo.cachix.org key configured.
          for p in "$OUT" "$UI" "$SRC"; do
            nix path-info --store "https://$CACHE.cachix.org" \
              --option extra-trusted-public-keys "biaogo.cachix.org-1:pEsKASFTETzWAVGGsjpHnq869V5KNeDOBhQahLlrPzY=" \
              "$p" >/dev/null \
              || { echo "cache self-check FAILED — not substitutable: $p"; exit 1; }
          done
          echo "cache self-check OK for $OUT"

      - name: Commit + push the pin bump
        if: steps.tag.outputs.already-pinned == 'false' || inputs.force
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          SHA="${{ steps.tag.outputs.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit (forced cache-refresh run)"
            exit 0
          fi
          git commit -m "pin(sunshine): ${TAG%-linux} ($TAG @ ${SHA:0:8})

          Automated: tag detected -> pin bumped -> CUDA/NVENC build verified ->
          closure pushed to Cachix ($CACHE) -> committed." \
            && git push
          echo "committed and pushed"

      - name: Summary
        if: steps.tag.outputs.already-pinned == 'false' || inputs.force
        run: |
          {
            echo "### foundation-sunshine pin updated"
            echo "- tag: \`${{ steps.tag.outputs.tag }}\`"
            echo "- commit: \`${{ steps.tag.outputs.sha }}\`"
            echo "- source hash: \`$(cat "$RUNNER_TEMP/src-hash.txt" 2>/dev/null || echo 'n/a (build step skipped)')\`"
            echo "- build: \`${{ steps.build.outputs.out }}\`"
            echo "- cache: pushed closure to \`${{ env.CACHE }}.cachix.org\`"
          } >> "$GITHUB_STEP_SUMMARY"